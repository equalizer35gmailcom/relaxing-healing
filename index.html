<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>Steven Halpern Healing Player</title>
<style>
  :root { --bg:#0f1220; --card:#1a1f36; --accent:#8fb8ff; --text:#e8ebf5; --muted:#8b93b3; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
  header { padding:20px 16px 8px; text-align:center; }
  h1 { margin:0; font-size:1.4rem; font-weight:600; }
  header p { margin:4px 0 0; color:var(--muted); font-size:.9rem; }
  main { max-width:1100px; margin:0 auto; padding:16px; display:grid; gap:16px; grid-template-columns:1fr; }
  @media (min-width:900px){ main { grid-template-columns:2fr 1fr; } }
  .player { background:var(--card); border-radius:12px; padding:12px; }
  .frame { position:relative; width:100%; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; }
  .frame iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
  .now { display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .now h2 { margin:0; font-size:1rem; }
  .now a { color:var(--accent); font-size:.85rem; }
  .controls { display:flex; gap:8px; margin-top:10px; }
  button { background:#262d4d; color:var(--text); border:0; padding:8px 14px; border-radius:8px; cursor:pointer; font-size:.9rem; }
  button:hover { background:#323b66; }
  ol { list-style:none; margin:0; padding:0; background:var(--card); border-radius:12px; overflow:hidden; }
  li button { width:100%; text-align:left; border-radius:0; background:transparent; padding:12px 14px; border-bottom:1px solid #262d4d; display:flex; gap:10px; }
  li button .n { color:var(--muted); min-width:1.6em; }
  li button.active { background:#262d4d; color:var(--accent); }
  .hint { color:var(--muted); font-size:.8rem; padding:0 16px 16px; text-align:center; }
</style>
</head>
<body>
<header>
  <h1>Steven Halpern: Healing Music</h1>
  <p>Pick a track. Plays 1 to 13 nonstop, then starts over.</p>
</header>
<main>
  <section class="player">
    <div class="frame"><div id="frame"></div></div>
    <div class="now">
      <h2 id="title">Select a track</h2>
      <a id="yt" href="#" target="_blank" rel="noopener">Watch on YouTube</a>
    </div>
    <div class="controls">
      <button id="all">&#9654; Play all</button>
      <button id="prev">&larr; Prev</button>
      <button id="next">Next &rarr;</button>
    </div>
  </section>
  <ol id="list"></ol>
</main>
<p class="hint">If a video says "unavailable" or shows an error, the uploader may block embedding. Use "Watch on YouTube" for that one.</p>

<script>
const tracks = [
  ["Adagio for Strings and Soul (432 Hz)", "w8E06A54_BQ"],
  ["In the Realms of Healing 432 Hz", "8Vw9R15QxHA"],
  ["Crystal Keys 432 Hz", "52wbAsg5KsQ"],
  ["Music for Sound Healing, Deep Theta 2.0 Part 13", "b9OqqJkyxtc"],
  ["Deep Theta 432 Hz", "Dn0eURaE_5c"],
  ["Deep Alpha (Part 1), brainwave entrainment", "GqSz6sy38EY"],
  ["Chakra Healing", "lASJbvjh_z0"],
  ["Crystal Angels 2.0", "MlW1EqdMBSM"],
  ["432 Hz Healing Touch, Healing Tones", "u2M9NYBS1XE"],
  ["Heartnotes 2.0 (with David Darling)", "21jDud5Ukzw"],
  ["On a Cloud of Sound (432 Hz)", "kHXUhQEM7K8"],
  ["Angels of Grace 432 Hz", "KugkJYLryvo"],
  ["Music for Microdosing (432 Hz)", "0Hz-6W6m0R0"]
];
let current = -1;
const list = document.getElementById('list');
tracks.forEach(([name], i) => {
  const li = document.createElement('li');
  const b = document.createElement('button');
  b.innerHTML = '<span class="n">' + (i+1) + '</span><span></span>';
  b.lastChild.textContent = name;
  b.onclick = () => play(i);
  li.appendChild(b);
  list.appendChild(li);
});
let player = null, ready = false, pending = -1;
function onYouTubeIframeAPIReady() {
  player = new YT.Player('frame', {
    host: 'https://www.youtube-nocookie.com',
    playerVars: { autoplay: 1, iv_load_policy: 3, playsinline: 1, origin: location.origin },
    events: {
      onReady: () => { ready = true; if (pending >= 0) play(pending); },
      onStateChange: e => { if (e.data === YT.PlayerState.ENDED) play(current + 1); },
      onError: () => { setTimeout(() => play(current + 1), 1500); }
    }
  });
}
function play(i) {
  current = (i + tracks.length) % tracks.length;
  const [name, id] = tracks[current];
  document.getElementById('title').textContent = name;
  document.getElementById('yt').href = 'https://www.youtube.com/watch?v=' + id;
  [...list.querySelectorAll('button')].forEach((b, k) => b.classList.toggle('active', k === current));
  if (!ready) { pending = current; return; }
  player.loadVideoById(id);
}
document.getElementById('prev').onclick = () => play(current < 0 ? 0 : current - 1);
document.getElementById('next').onclick = () => play(current + 1);
document.getElementById('all').onclick = () => play(0);
const t = document.createElement('script');
t.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(t);
</script>
</body>
</html>
